<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pc_shop</title>
    <link rel="stylesheet" href="product.css">
    
<script type="module" src="product.js"></script>

</head>
<body>
    <header class="header_container">
        <h1>pc<span>_</span>shop</h1>
        <nav class="nav_content">
            <ul>
                <li><a href="#">Laptop</a></li>
                 <li><a href="#">Desktop</a></li>
                <li><a href="#">Accessories</a></li>
            </ul>
            <div class="header_icons">
                <a href="../login page/index.html"><img src="User.png" alt="img"></a>
                <a href="../Cart/cart.html"><img src="Vecto3r.png" alt="img"></a>
            </div>
        </nav>
         
    </header>
    <main class="main_content">
        <section class=" hero">
            <div class="hero_left">
                <nav class="nav_content">
                    <ul>
                        <li><a href="../home/home.html">Home</a></li>
                        <span>></span>
                        <li><a href="#">Product</a></li>
                    </ul>
                </nav>
                <h2>All Products</h2>
                <p>Discover our full range of high-quality computers,<br>
                    accessories and more. Find the perfect product <br>
                    for your needs.
                </p>    
            </div>
            <div class="hero_right">
                <h1>pc_shop</h1>
            </div>
            <hr>
        </section>
         

        <section class="catalog" id="products">
    <div class="catalog-toolbar">
        <div class="filters">
            <button class="filter-btn active" data-filter="All">
                All
            </button>

            <button class="filter-btn" data-filter="Laptop">
                Laptop
            </button>

            <button class="filter-btn" data-filter="Desktop">
                Desktop
            </button>

            <button class="filter-btn" data-filter="Accessories">
                Accessories
            </button>
        </div>

        <form id="search-form">
            <input
                id="search-input"
                type="search"
                placeholder="Search by name or brand"
            >
            <button type="submit">Search</button>
        </form>
    </div>

    <p id="results-message"></p>

    <div class="product-grid" id="product-grid"></div>

    <p id="empty-state" hidden>
        No products found. Try another search or category.
    </p>
</section>
    </main>
</body>
</html>
